<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexBook | Contact</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col pt-20">

    <nav class="glass fixed w-full z-50 top-0 left-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex items-center">
                    <a href="index.html" class="flex items-center gap-2">
                        <i class="fas fa-book-open text-3xl text-sky-400"></i>
                        <span class="text-2xl font-bold tracking-tight serif-font">Nex<span class="text-gradient">Book</span></span>
                    </a>
                </div>
                <!-- Navbar links injected properly -->
                <div class="hidden md:flex items-center space-x-8">
                    <a href="index.html" class="text-gray-300 hover:text-white transition-colors">Home</a>
                    <a href="books.html" class="text-gray-300 hover:text-white transition-colors">Books</a>
                    <a href="contact.html" class="text-sky-400 font-medium border-b-2 border-sky-400 pb-1">Contact</a>
                </div>
                <div class="flex items-center" id="auth-links"></div>
            </div>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center p-4 min-h-[85vh] relative z-10 w-full max-w-4xl mx-auto py-12">
        <div class="glass-card w-full p-8 md:p-12 rounded-3xl relative animate-fade-in shadow-2xl flex flex-col md:flex-row gap-12">
            
            <div class="w-full md:w-1/3 flex flex-col justify-center">
                <h2 class="text-4xl font-bold serif-font mb-4">Get in <span class="text-gradient">Touch.</span></h2>
                <p class="text-slate-400 mb-8">We'd love to hear from you. Please fill out the form or reach us directly.</p>
                
                <div class="space-y-6">
                    <div class="flex flex-col">
                        <span class="font-bold text-white mb-1 uppercase text-xs tracking-wider">Email</span>
                        <span class="text-sky-400">support@nexbook.com</span>
                    </div>
                    <div class="flex flex-col">
                        <span class="font-bold text-white mb-1 uppercase text-xs tracking-wider">Phone</span>
                        <span class="text-slate-300">+1 (800) 123-4567</span>
                    </div>
                    <div class="flex flex-col">
                        <span class="font-bold text-white mb-1 uppercase text-xs tracking-wider">Address</span>
                        <span class="text-slate-300">123 Bibliophile Ave<br>Reader's District, RD 90210</span>
                    </div>
                </div>
            </div>
            
            <div class="w-full md:w-2/3">
                <div id="success-alert" class="hidden bg-green-500/10 border border-green-500/50 text-green-400 px-4 py-3 rounded-xl mb-6 text-sm text-center">
                    Message sent successfully! We will get back to you soon.
                </div>
                <div id="error-alert" class="hidden bg-red-500/10 border border-red-500/50 text-red-400 px-4 py-3 rounded-xl mb-6 text-sm text-center"></div>

                <form id="contact-form" class="space-y-5">
                    <div>
                        <input type="text" id="contactFullName" class="input-glass w-full px-4 py-3.5 rounded-xl border-slate-700 bg-slate-800/50" placeholder="Your Full Name" required>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <input type="email" id="contactEmail" class="input-glass w-full px-4 py-3.5 rounded-xl border-slate-700 bg-slate-800/50" placeholder="Email Address" required>
                        <input type="text" id="contactMobileNumber" class="input-glass w-full px-4 py-3.5 rounded-xl border-slate-700 bg-slate-800/50" placeholder="Phone Number" required>
                    </div>
                    <div>
                        <textarea id="contactMessage" rows="5" class="input-glass w-full px-4 py-3.5 rounded-xl border-slate-700 bg-slate-800/50" placeholder="How can we help you?" required></textarea>
                    </div>
                    
                    <button type="submit" class="w-full bg-slate-100 hover:bg-white text-slate-900 font-bold py-4 rounded-xl transition-all shadow-lg hover:shadow-white/20 transform hover:-translate-y-1">
                        <span id="btn-text">Send Message</span>
                        <i id="btn-loader" class="fas fa-circle-notch fa-spin hidden"></i>
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script>
        document.getElementById('contact-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btnText = document.getElementById('btn-text');
            const btnLoader = document.getElementById('btn-loader');
            const successAlert = document.getElementById('success-alert');
            const errorAlert = document.getElementById('error-alert');
            const form = document.getElementById('contact-form');
            
            btnText.classList.add('hidden');
            btnLoader.classList.remove('hidden');
            errorAlert.classList.add('hidden');
            successAlert.classList.add('hidden');
            
            const payload = {
                contactFullName: document.getElementById('contactFullName').value,
                contactActualId: localStorage.getItem('username') || "Guest",
                contactMobileNumber: document.getElementById('contactMobileNumber').value,
                contactEmail: document.getElementById('contactEmail').value,
                contactMessage: document.getElementById('contactMessage').value,
                contactTime: "" 
            };
            
            try {
                // Anyone can submit contact form, using vanilla fetch just in case we are logged out. Backend allows /api/contact/** for all
                const response = await fetch(`${API_BASE_URL}/contact`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if(!response.ok) throw new Error();
                
                successAlert.classList.remove('hidden');
                form.reset();
                
            } catch (error) {
                errorAlert.textContent = "Failed to send message. Try again later.";
                errorAlert.classList.remove('hidden');
            } finally {
                btnText.classList.remove('hidden');
                btnLoader.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
