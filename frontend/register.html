<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexBook | Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col pt-20">

    <!-- Navbar -->
    <nav class="glass fixed w-full z-50 top-0 left-0">
        <!-- Reusing Navbar HTML from Login/Index... -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex items-center">
                    <a href="index.html" class="flex items-center gap-2">
                        <i class="fas fa-book-open text-3xl text-sky-400"></i>
                        <span class="text-2xl font-bold tracking-tight serif-font">Nex<span class="text-gradient">Book</span></span>
                    </a>
                </div>
                <div class="hidden md:flex items-center space-x-8">
                    <a href="index.html" class="text-gray-300 hover:text-white transition-colors">Home</a>
                    <a href="books.html" class="text-gray-300 hover:text-white transition-colors">Books</a>
                </div>
                <div class="flex items-center" id="auth-links">
                    <a href="login.html" class="text-gray-300 hover:text-white transition-colors mr-4 font-medium">Log In</a>
                    <a href="register.html" class="px-4 py-2 rounded-lg bg-gradient-primary text-white transition-all shadow-lg shadow-sky-500/30 font-medium">Sign Up</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center p-4 min-h-[85vh] relative z-10 py-12">
        <div class="glass-card w-full max-w-2xl p-8 rounded-2xl relative animate-fade-in shadow-2xl shadow-sky-900/20">
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-sky-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 z-0"></div>
            
            <div class="relative z-10 text-center mb-8">
                <h2 class="text-3xl font-bold serif-font mb-2">Create an Account</h2>
                <p class="text-slate-400 text-sm">Join NexBook to start building your library.</p>
            </div>
            
            <div id="error-alert" class="hidden bg-red-500/10 border border-red-500/50 text-red-400 px-4 py-3 rounded-xl mb-6 text-sm relative z-10 text-center">
            </div>

            <form id="register-form" class="relative z-10 grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Left Column -->
                <div>
                    <label class="block text-slate-300 text-sm font-medium mb-2">Full Name</label>
                    <input type="text" id="fullName" class="input-glass w-full px-4 py-3 rounded-xl mb-4" required>
                    
                    <label class="block text-slate-300 text-sm font-medium mb-2">Username</label>
                    <input type="text" id="userName" class="input-glass w-full px-4 py-3 rounded-xl mb-4" required>
                    
                    <label class="block text-slate-300 text-sm font-medium mb-2">Password</label>
                    <input type="password" id="password" class="input-glass w-full px-4 py-3 rounded-xl mb-4" required>
                </div>
                
                <!-- Right Column -->
                <div>
                    <label class="block text-slate-300 text-sm font-medium mb-2">Email</label>
                    <input type="email" id="email" class="input-glass w-full px-4 py-3 rounded-xl mb-4" required>
                    
                    <label class="block text-slate-300 text-sm font-medium mb-2">Contact Number</label>
                    <input type="text" id="contactNumber" class="input-glass w-full px-4 py-3 rounded-xl mb-4" required>
                    
                    <label class="block text-slate-300 text-sm font-medium mb-2">Security Question</label>
                    <select id="question" class="input-glass w-full px-4 py-3 rounded-xl mb-4 text-slate-200">
                        <option value="Which is your Favourite Movie?">Which is your Favourite Movie?</option>
                        <option value="What is your pet's name?">What is your pet's name?</option>
                        <option value="Which city were you born in?">Which city were you born in?</option>
                    </select>

                    <label class="block text-slate-300 text-sm font-medium mb-2">Answer</label>
                    <input type="text" id="answer" class="input-glass w-full px-4 py-3 rounded-xl mb-6" required>
                </div>
                
                <div class="col-span-1 md:col-span-2 mt-4">
                    <button type="submit" class="w-full bg-gradient-primary hover:bg-sky-500 text-white font-bold py-4 px-4 rounded-xl transition-all flex justify-center items-center hover:shadow-lg hover:shadow-sky-500/30">
                        <span id="btn-text">Register Account <i class="fas fa-user-plus ml-2"></i></span>
                        <i id="btn-loader" class="fas fa-circle-notch fa-spin hidden"></i>
                    </button>
                </div>
            </form>
            
            <p class="mt-6 text-center text-slate-400 text-sm relative z-10">
                Already have an account? <a href="login.html" class="text-sky-400 hover:text-sky-300 hover:underline">Log in</a>
            </p>
        </div>
    </main>

    <footer class="border-t border-slate-800 py-8 mt-auto glass">
        <div class="max-w-7xl mx-auto px-4 text-center text-slate-400">
            <p>&copy; 2026 NexBook. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btnText = document.getElementById('btn-text');
            const btnLoader = document.getElementById('btn-loader');
            const errorAlert = document.getElementById('error-alert');
            
            btnText.classList.add('hidden');
            btnLoader.classList.remove('hidden');
            errorAlert.classList.add('hidden');
            
            const payload = {
                fullName: document.getElementById('fullName').value,
                userName: document.getElementById('userName').value,
                password: document.getElementById('password').value,
                email: document.getElementById('email').value,
                contactNumber: document.getElementById('contactNumber').value,
                question: document.getElementById('question').value,
                answer: document.getElementById('answer').value
            };
            
            try {
                const response = await fetch(`${API_BASE_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if(!response.ok) {
                    const txt = await response.text();
                    throw new Error(txt || 'Failed to register');
                }
                
                const data = await response.json();
                localStorage.setItem('token', data.token);
                localStorage.setItem('username', data.username);
                localStorage.setItem('role', data.role);
                
                window.location.href = 'index.html';
                
            } catch (error) {
                errorAlert.textContent = error.message;
                errorAlert.classList.remove('hidden');
            } finally {
                btnText.classList.remove('hidden');
                btnLoader.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
