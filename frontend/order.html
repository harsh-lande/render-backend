<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexBook | Checkout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col pt-20">

    <nav class="glass fixed w-full z-50 top-0 left-0">
        <!-- Reused Navbar -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex items-center">
                    <a href="index.html" class="flex flex-center gap-2">
                        <i class="fas fa-book-open text-3xl text-sky-400"></i>
                        <span class="text-2xl font-bold tracking-tight serif-font">Nex<span class="text-gradient">Book</span></span>
                    </a>
                </div>
                <div class="flex items-center" id="auth-links"></div>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-bold serif-font mb-2">Checkout</h1>
            <p class="text-slate-400">Complete your secure purchase.</p>
        </div>

        <div class="glass-card rounded-3xl p-8 relative overflow-hidden">
            <div class="absolute -top-10 -right-10 w-48 h-48 bg-sky-500 rounded-full mix-blend-multiply filter blur-3xl opacity-10"></div>
            
            <div id="checkout-summary" class="mb-8 p-6 bg-slate-800/50 rounded-2xl border border-slate-700 flex justify-between items-center font-bold text-xl text-white">
                <span>Total Amount:</span>
                <span id="checkout-total" class="text-sky-400">₹0</span>
            </div>
            
            <div id="success-alert" class="hidden bg-green-500/10 border border-green-500/50 text-green-400 px-6 py-4 rounded-xl mb-6 text-center">
                <i class="fas fa-check-circle text-2xl mb-2"></i><br>
                <span class="font-bold text-lg">Order Placed Successfully!</span><br>
                Thank you for shopping with NexBook. Redirecting...
            </div>
            
            <div id="error-alert" class="hidden bg-red-500/10 border border-red-500/50 text-red-400 px-4 py-3 rounded-xl mb-6 text-center"></div>

            <form id="order-form" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-slate-300 text-sm font-medium mb-1">Full Name</label>
                        <input type="text" id="orderName" class="input-glass w-full px-4 py-3 rounded-xl" required>
                    </div>
                    <div>
                        <label class="block text-slate-300 text-sm font-medium mb-1">Mobile Number</label>
                        <input type="text" id="orderMobile" class="input-glass w-full px-4 py-3 rounded-xl" required>
                    </div>
                </div>
                
                <div>
                    <label class="block text-slate-300 text-sm font-medium mb-1">Full Delivery Address</label>
                    <textarea id="orderAddress" rows="3" class="input-glass w-full px-4 py-3 rounded-xl" required></textarea>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-slate-300 text-sm font-medium mb-1">City</label>
                        <input type="text" id="orderCity" class="input-glass w-full px-4 py-3 rounded-xl" required>
                    </div>
                    <div>
                        <label class="block text-slate-300 text-sm font-medium mb-1">State</label>
                        <input type="text" id="orderState" class="input-glass w-full px-4 py-3 rounded-xl" required>
                    </div>
                    <div>
                        <label class="block text-slate-300 text-sm font-medium mb-1">Pincode</label>
                        <input type="number" id="orderPincode" class="input-glass w-full px-4 py-3 rounded-xl" required>
                    </div>
                </div>

                <div class="pt-6 mt-6 border-t border-slate-700 border-dashed">
                    <button type="submit" class="w-full bg-gradient-primary text-white font-bold py-4 px-6 rounded-xl hover:shadow-lg hover:shadow-sky-500/30 transition-all flex justify-center items-center gap-2 text-lg">
                        <span id="btn-text">Confirm & Pay <i class="fas fa-lock ml-1"></i></span>
                        <i id="btn-loader" class="fas fa-circle-notch fa-spin hidden"></i>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if(!localStorage.getItem('token')) {
                window.location.href = 'login.html';
                return;
            }
            
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            if(cart.length === 0) {
                window.location.href = 'cart.html';
                return;
            }
            
            const total = cart.reduce((acc, item) => acc + (item.price * item.quantity), 0);
            document.getElementById('checkout-total').textContent = `₹${total}`;
            
            // Auto fill username
            document.getElementById('orderName').value = localStorage.getItem('username');
        });

        document.getElementById('order-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btnText = document.getElementById('btn-text');
            const btnLoader = document.getElementById('btn-loader');
            const successAlert = document.getElementById('success-alert');
            const errorAlert = document.getElementById('error-alert');
            const form = document.getElementById('order-form');
            
            btnText.classList.add('hidden');
            btnLoader.classList.remove('hidden');
            errorAlert.classList.add('hidden');
            
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const total = cart.reduce((acc, item) => acc + (item.price * item.quantity), 0);
            let bookListStr = "";
            cart.forEach(item => {
                bookListStr += `(Name: ${item.name}. Amount: ${item.quantity}), `;
            });

            const payload = {
                orderName: document.getElementById('orderName').value,
                orderAddress: document.getElementById('orderAddress').value,
                orderPincode: parseInt(document.getElementById('orderPincode').value),
                orderCity: document.getElementById('orderCity').value,
                orderState: document.getElementById('orderState').value,
                orderMobile: document.getElementById('orderMobile').value,
                orderRegisterId: 0, // In a real app, backend extracts this from JWT, but legacy logic required an ID. We just pass 0 or a dummy value.
                orderTotalPrice: total,
                orderListBooks: bookListStr
            };
            
            try {
                await fetchAPI('/orders', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                
                successAlert.classList.remove('hidden');
                form.classList.add('hidden');
                document.getElementById('checkout-summary').classList.add('hidden');
                
                // Clear cart
                localStorage.removeItem('cart');
                updateCartCount();
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 3000);
                
            } catch (error) {
                errorAlert.textContent = "Failed to place order. Please try again.";
                errorAlert.classList.remove('hidden');
            } finally {
                btnText.classList.remove('hidden');
                btnLoader.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
