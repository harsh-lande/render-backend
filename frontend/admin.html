<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexBook | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col pt-20">

    <nav class="glass fixed w-full z-50 top-0 left-0 border-b border-sky-500/30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex items-center gap-3">
                    <i class="fas fa-shield-alt text-3xl text-red-500"></i>
                    <span class="text-2xl font-bold font-sans tracking-tight">ADMIN <span class="text-slate-400 font-light">PANEL</span></span>
                </div>
                <div class="flex items-center">
                    <button onclick="logout()" class="px-4 py-2 rounded-lg bg-red-500/20 text-red-400 border border-red-500/50 hover:bg-red-500 hover:text-white transition-colors">Sign Out <i class="fas fa-sign-out-alt ml-2"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Add Book Form -->
        <div class="lg:col-span-1">
            <div class="glass-card rounded-2xl p-6 sticky top-28 border border-sky-900/50 shadow-2xl">
                <h3 class="text-2xl font-bold mb-6 flex items-center gap-2"><i class="fas fa-plus-circle text-sky-400"></i> Add New Book</h3>
                
                <form id="add-book-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Book Name</label>
                        <input type="text" id="bookName" class="input-glass w-full px-3 py-2 rounded-lg text-sm" required>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Category</label>
                        <select id="bookCategory" class="input-glass w-full px-3 py-2 rounded-lg text-sm bg-slate-800" required>
                            <option value="Suspence">Suspense</option>
                            <option value="Architecture">Architecture</option>
                            <option value="Programming">Programming</option>
                            <option value="Literature">Literature</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Description</label>
                        <textarea id="bookDescription" rows="3" class="input-glass w-full px-3 py-2 rounded-lg text-sm" required></textarea>
                    </div>
                    <div class="flex gap-4">
                        <div class="w-1/2">
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Price (₹)</label>
                            <input type="number" id="bookPrice" class="input-glass w-full px-3 py-2 rounded-lg text-sm" required>
                        </div>
                        <div class="w-1/2">
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Image Path</label>
                            <input type="text" id="bookImg" value="book_img/default.jpg" class="input-glass w-full px-3 py-2 rounded-lg text-sm" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="w-full bg-sky-500 hover:bg-sky-400 text-slate-900 font-bold py-3 rounded-lg mt-4 transition-colors">
                        Save Book
                    </button>
                </form>
            </div>
        </div>

        <!-- Management View -->
        <div class="lg:col-span-2 space-y-8">
            <!-- Books List -->
            <div class="glass-card rounded-2xl p-6 border border-slate-700">
                <h3 class="text-2xl font-bold mb-6 flex items-center justify-between">
                    <span><i class="fas fa-book text-sky-400 mr-2"></i> Manage Books</span>
                    <button onclick="loadAdminBooks()" class="text-sm px-3 py-1 bg-slate-800 hover:bg-slate-700 rounded-md text-sky-400"><i class="fas fa-sync-alt"></i></button>
                </h3>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-700 text-xs uppercase tracking-wider text-slate-400">
                                <th class="pb-3 px-2">ID</th>
                                <th class="pb-3 px-2">Name</th>
                                <th class="pb-3 px-2">Category</th>
                                <th class="pb-3 px-2">Price</th>
                                <th class="pb-3 px-2 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="admin-books-tbody" class="text-sm">
                            <tr><td colspan="5" class="py-10 text-center"><i class="fas fa-circle-notch fa-spin text-sky-400 text-3xl"></i></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Orders List -->
            <div class="glass-card rounded-2xl p-6 border border-slate-700">
                <h3 class="text-2xl font-bold mb-6 flex items-center justify-between">
                    <span><i class="fas fa-receipt text-sky-400 mr-2"></i> Recent Orders</span>
                    <button onclick="loadAdminOrders()" class="text-sm px-3 py-1 bg-slate-800 hover:bg-slate-700 rounded-md text-sky-400"><i class="fas fa-sync-alt"></i></button>
                </h3>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-700 text-xs uppercase tracking-wider text-slate-400">
                                <th class="pb-3 px-2">Order ID</th>
                                <th class="pb-3 px-2">Customer</th>
                                <th class="pb-3 px-2">Total</th>
                                <th class="pb-3 px-2">Address</th>
                            </tr>
                        </thead>
                        <tbody id="admin-orders-tbody" class="text-sm">
                            <tr><td colspan="4" class="py-10 text-center"><i class="fas fa-circle-notch fa-spin text-indigo-400 text-3xl"></i></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const role = localStorage.getItem('role');
            if(role !== 'ROLE_ADMIN') {
                window.location.href = 'index.html'; // Kick out non-admins
                return;
            }
            
            // Wait slight delay to ensure fetch wrapper knows token
            setTimeout(() => {
                loadAdminBooks();
                loadAdminOrders();
            }, 100);
        });

        async function loadAdminBooks() {
            const tbody = document.getElementById('admin-books-tbody');
            try {
                const books = await fetchAPI('/books');
                tbody.innerHTML = books.map(b => `
                    <tr class="border-b border-slate-800/50 hover:bg-slate-800/50 transition-colors">
                        <td class="py-3 px-2 text-slate-400">#${b.bookId}</td>
                        <td class="py-3 px-2 font-medium">${b.bookName}</td>
                        <td class="py-3 px-2"><span class="bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded text-xs">${b.bookCategory}</span></td>
                        <td class="py-3 px-2 font-mono text-sky-400">₹${b.bookPrice}</td>
                        <td class="py-3 px-2 text-right">
                            <button onclick="deleteBook(${b.bookId})" class="text-red-400 hover:text-red-300 p-2"><i class="fas fa-trash-alt"></i></button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-red-500">Error loading books</td></tr>`;
            }
        }

        async function loadAdminOrders() {
            const tbody = document.getElementById('admin-orders-tbody');
            try {
                const orders = await fetchAPI('/admin/orders');
                if(orders.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="py-4 text-center text-slate-400">No orders yet.</td></tr>`;
                    return;
                }
                tbody.innerHTML = orders.map(o => `
                    <tr class="border-b border-slate-800/50 hover:bg-slate-800/50 transition-colors">
                        <td class="py-3 px-2 font-mono text-slate-400">#${o.orderId}</td>
                        <td class="py-3 px-2">
                            <div class="font-medium">${o.orderName}</div>
                            <div class="text-xs text-slate-500">${o.orderMobile}</div>
                        </td>
                        <td class="py-3 px-2 font-bold text-sky-400">₹${o.orderTotalPrice}</td>
                        <td class="py-3 px-2 text-xs text-slate-400 max-w-[200px] truncate" title="${o.orderAddress}, ${o.orderCity}">${o.orderAddress}, ${o.orderCity}</td>
                    </tr>
                `).join('');
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="4" class="py-4 text-center text-red-500">Error loading orders</td></tr>`;
            }
        }

        async function deleteBook(id) {
            if(!confirm('Are you sure you want to delete this book?')) return;
            try {
                await fetchAPI(`/admin/books/${id}`, { method: 'DELETE' });
                showToast(`Book #${id} deleted.`);
                loadAdminBooks();
            } catch (err) {
                alert('Failed to delete book');
            }
        }

        document.getElementById('add-book-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                bookName: document.getElementById('bookName').value,
                bookCategory: document.getElementById('bookCategory').value,
                bookDescription: document.getElementById('bookDescription').value,
                bookPrice: parseInt(document.getElementById('bookPrice').value),
                bookImg: document.getElementById('bookImg').value,
                bookTime: 0
            };
            
            try {
                await fetchAPI('/admin/books', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                
                showToast('Book added successfully!');
                e.target.reset();
                loadAdminBooks();
            } catch (error) {
                alert('Failed to add book.');
            }
        });
    </script>
</body>
</html>
