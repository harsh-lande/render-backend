<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexBook | Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col pt-20">

    <nav class="glass fixed w-full z-50 top-0 left-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex items-center">
                    <a href="index.html" class="flex items-center gap-2">
                        <i class="fas fa-book-open text-3xl text-sky-400"></i>
                        <span class="text-2xl font-bold tracking-tight serif-font">Nex<span class="text-gradient">Book</span></span>
                    </a>
                </div>
                <div class="hidden md:flex items-center space-x-8">
                    <a href="index.html" class="text-gray-300 hover:text-white transition-colors">Home</a>
                    <a href="books.html" class="text-sky-400 font-medium border-b-2 border-sky-400 pb-1">Books</a>
                    <a href="contact.html" class="text-gray-300 hover:text-white transition-colors">Contact</a>
                </div>
                <div class="flex items-center" id="auth-links"></div>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
        <!-- Header & Search -->
        <div class="flex flex-col md:flex-row justify-between items-end mb-12 animate-fade-in">
            <div>
                <h1 class="text-4xl font-bold serif-font mb-2">Our Collection</h1>
                <p class="text-slate-400">Explore our vast library of premium titles.</p>
            </div>
            
            <div class="mt-6 md:mt-0 flex gap-4 w-full md:w-auto">
                <div class="relative w-full md:w-64">
                    <i class="fas fa-search absolute left-3 top-3.5 text-slate-400"></i>
                    <input type="text" id="search-input" class="input-glass w-full pl-10 pr-4 py-3 rounded-xl" placeholder="Search books...">
                </div>
                <!-- Categories Dropdown (Could be dynamic) -->
                <select id="category-select" class="input-glass px-4 py-3 rounded-xl text-slate-200 w-40 md:w-48 appearance-none bg-slate-800">
                    <option value="">All Categories</option>
                    <option value="Suspence">Suspense</option>
                    <option value="Architecture">Architecture</option>
                    <option value="Programming">Programming</option>
                </select>
            </div>
        </div>

        <!-- Books Grid -->
        <div id="books-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
            <!-- Dynamic Content loaded via JS -->
            <div class="flex justify-center items-center col-span-full py-20">
                <i class="fas fa-circle-notch fa-spin text-4xl text-sky-400"></i>
            </div>
        </div>
    </main>

    <footer class="border-t border-slate-800 py-8 mt-auto glass">
        <div class="max-w-7xl mx-auto px-4 text-center text-slate-400">
            <p>&copy; 2026 NexBook. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script>
        const booksGrid = document.getElementById('books-grid');
        const searchInput = document.getElementById('search-input');
        const categorySelect = document.getElementById('category-select');
        let allBooks = [];

        // Load Books
        async function loadBooks() {
            try {
                // Not using fetchAPI because GET /api/books is permitted to all, no token required
                const res = await fetch(`${API_BASE_URL}/books`);
                allBooks = await res.json();
                renderBooks(allBooks);
            } catch (err) {
                booksGrid.innerHTML = `<div class="col-span-full text-center text-red-400 py-10">Failed to load books. Ensure backend is running.</div>`;
            }
        }

        // Render Books
        function renderBooks(books) {
            if(books.length === 0) {
                booksGrid.innerHTML = `<div class="col-span-full text-center text-slate-400 py-10">No books found matching your criteria.</div>`;
                return;
            }
            
            booksGrid.innerHTML = books.map((b, index) => `
                <div class="glass-card rounded-2xl overflow-hidden flex flex-col h-full animate-fade-in" style="animation-delay: ${index * 50}ms">
                    <div class="h-64 overflow-hidden relative group">
                        <!-- Format fallback just in case image path has / or not -->
                        <img src="${b.bookImg.startsWith('book_img/') ? 'images/' + b.bookImg.replace('book_img/', '') : 'images/default.jpg'}" 
                             alt="${b.bookName}" 
                             class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity flex items-end justify-center pb-4">
                            <button onclick="window.location.href='book-details.html?id=${b.bookId}'" class="bg-white/20 hover:bg-white/30 backdrop-blur-md px-6 py-2 rounded-lg text-white font-medium shadow-xl">View Details</button>
                        </div>
                        <span class="absolute top-3 left-3 bg-slate-900/80 backdrop-blur text-sky-400 text-xs font-bold px-3 py-1 rounded-full border border-sky-500/30">
                            ${b.bookCategory}
                        </span>
                    </div>
                    <div class="p-6 flex flex-col flex-grow">
                        <h3 class="text-xl font-bold serif-font mb-2 line-clamp-1" title="${b.bookName}">${b.bookName}</h3>
                        <p class="text-sky-400 font-bold text-lg mb-4 mt-auto">₹${b.bookPrice}</p>
                        
                        <button onclick="addToCart(${b.bookId}, '${b.bookName.replace(/'/g, "\\'")}', ${b.bookPrice}, '${b.bookImg}')" class="w-full py-2.5 rounded-lg border border-sky-500 text-sky-400 hover:bg-sky-500 hover:text-white transition-colors flex items-center justify-center gap-2 font-medium">
                            <i class="fas fa-cart-plus"></i> Add to Cart
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Filtering Logic
        function filterBooks() {
            const query = searchInput.value.toLowerCase();
            const cat = categorySelect.value;
            
            const filtered = allBooks.filter(b => {
                const matchQuery = b.bookName.toLowerCase().includes(query) || b.bookDescription.toLowerCase().includes(query);
                const matchCat = cat === "" || b.bookCategory === cat;
                return matchQuery && matchCat;
            });
            
            renderBooks(filtered);
        }

        searchInput.addEventListener('input', filterBooks);
        categorySelect.addEventListener('change', filterBooks);

        // Init
        document.addEventListener('DOMContentLoaded', loadBooks);
    </script>
</body>
</html>
